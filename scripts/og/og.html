<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../../public/fonts/bricolage-latin.woff2") format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "IBM Plex Sans"; src: url("../../public/fonts/plex-sans-latin.woff2") format("woff2"); font-weight: 400 600; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; box-sizing: border-box;
    background-color: #EEF1F5; color: #16213E; font-family: "IBM Plex Sans", sans-serif;
    background-image: linear-gradient(rgba(22,33,62,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(22,33,62,.12) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .graph { position: absolute; right: -90px; top: -10px; width: 760px; opacity: .95; }
  .text { position: absolute; left: 72px; bottom: 74px; width: 640px; }
  h1 { font: 800 112px/.88 "Bricolage Grotesque", sans-serif; letter-spacing: -0.035em; margin: 0 0 28px; font-variation-settings: "opsz" 96; }
  h1 span { display: block; }
  p { font: 400 34px/1.25 "Bricolage Grotesque", sans-serif; margin: 0 0 20px; max-width: 22ch; }
  .meta { font: 500 22px/1.3 "IBM Plex Sans", sans-serif; color: #4E5D73; display: flex; align-items: center; gap: 14px; }
  .meta i { width: 14px; height: 14px; border-radius: 50%; background: #E8A317; box-shadow: 0 0 0 6px rgba(232,163,23,.22); }
  .veil { position: absolute; left: 0; top: 0; width: 780px; height: 630px; background: linear-gradient(90deg, rgba(238,241,245,.96) 70%, rgba(238,241,245,0)); }
</style>
</head>
<body>
  <img class="graph" src="../../public/graph-fallback.svg" alt="">
  <div class="veil"></div>
  <div class="text">
    <h1><span>Antony</span><span>Selva Jasfer</span></h1>
    <p>AI systems that show their evidence before they ask to be trusted.</p>
    <div class="meta"><i></i>AI &amp; Data Science, Amrita Vishwa Vidyapeetham</div>
  </div>
</body>
</html>
